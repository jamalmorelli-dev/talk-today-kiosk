<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Talk Today Timeclock (Zero-Latency Edition)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --success: #10b981;
      --danger: #ef4444;
      --border: #334155;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .header {
      width: 100%;
      text-align: center;
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--border);
      background-color: var(--panel);
    }
    .header h1 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: 1px;
    }
    .container {
      width: 100%;
      max-width: 400px;
      padding: 2rem 1.5rem;
      box-sizing: border-box;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    label.field-label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: var(--text-muted);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    input[type="number"], input[type="password"], input[type="text"] {
      width: 100%;
      padding: 1rem;
      font-size: 1.5rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background-color: #0b0f19;
      color: #fff;
      box-sizing: border-box;
      text-align: center;
      letter-spacing: 0.1em;
    }
    input[type="text"].note-input {
      font-size: 1rem;
      letter-spacing: normal;
      text-align: left;
    }
    .btn-row {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
    }
    button {
      flex: 1;
      padding: 1.2rem;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-in {
      background-color: var(--success);
    }
    .btn-out {
      background-color: var(--danger);
    }
    
    #videoElement {
      width: 100%;
      border-radius: 12px;
      background: #000;
      display: none;
      margin-bottom: 1rem;
      transform: scaleX(-1);
    }
    #canvasElement {
      display: none;
    }
    
    #statusMsg {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
      display: none;
    }
    .status-success {
      background-color: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .status-error {
      background-color: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    
    .loading-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.8);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }
    .spinner {
      width: 50px; height: 50px;
      border: 5px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  
  <div class="header">
    <h1 style="color: #60a5fa;">TALK TODAY USA</h1>
    <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem;">Zero-Latency Kiosk <span id="syncDot" style="color:red">•</span></div>
  </div>

  <div class="container">
    
    <video id="videoElement" autoplay playsinline></video>
    <canvas id="canvasElement"></canvas>

    <div class="form-group">
      <label class="field-label">Staff Code (4 Digits)</label>
      <input type="number" id="staffCode" placeholder="0000" inputmode="numeric" pattern="[0-9]*" maxlength="4">
    </div>
    
    <div class="form-group">
      <label class="field-label">Secret PIN</label>
      <input type="password" id="staffPin" placeholder="****" inputmode="numeric" pattern="[0-9]*" maxlength="6">
    </div>

    <div class="form-group">
      <label class="field-label">Optional Note</label>
      <input type="text" id="punchNote" class="note-input" placeholder="e.g. Forgot to clock in earlier">
    </div>

    <div id="statusMsg"></div>

    <div class="btn-row">
      <button class="btn-in" onclick="punch('IN')">CLOCK IN</button>
      <button class="btn-out" onclick="punch('OUT')">CLOCK OUT</button>
    </div>
    
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycby08nfi0EGsBwlz9XjmHiRa0THQpD-PJa4lUU_420Gw9QrPhvTVCM9yTJ04LzZ9CdUOIw/exec";

    var video = document.getElementById('videoElement');
    var canvas = document.getElementById('canvasElement');
    var stream = null;
    var ROSTER = {}; // local hashmap of code -> {pin, name}

    async function initCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "user" }, 
          audio: false 
        });
        video.srcObject = stream;
        video.style.display = 'block';
      } catch (err) {
        console.error("Camera error:", err);
      }
    }
    
    async function syncRoster() {
      try {
        document.getElementById('syncDot').style.color = "yellow";
        const res = await fetch(API_URL, {
          redirect: 'follow',
          method: 'POST',
          body: JSON.stringify({ action: 'GET_ROSTER' }),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        });
        const data = await res.json();
        if (data.ok && data.roster) {
          data.roster.forEach(t => { ROSTER[t.code] = { pin: t.pin, name: t.name }; });
          document.getElementById('syncDot').style.color = "lime";
        } else {
          document.getElementById('syncDot').style.color = "red";
        }
      } catch(e) {
        document.getElementById('syncDot').style.color = "red";
      }
    }

    window.addEventListener('load', () => {
      initCamera();
      syncRoster();
      // Keep roster fresh every 5 mins in background
      setInterval(syncRoster, 5 * 60 * 1000);
    });

    document.getElementById('staffCode').addEventListener('input', function(e) {
      if(this.value.length > 4) this.value = this.value.slice(0, 4);
    });
    document.getElementById('staffPin').addEventListener('input', function(e) {
      if(this.value.length > 6) this.value = this.value.slice(0, 6);
    });

    function getDeviceId() {
      var did = localStorage.getItem('UAP_DEVICE_ID');
      if (!did) {
        did = 'DEV_' + Math.random().toString(36).substring(2, 10).toUpperCase();
        localStorage.setItem('UAP_DEVICE_ID', did);
      }
      return did;
    }

    async function punch(action) {
      var code = document.getElementById('staffCode').value;
      var pin = document.getElementById('staffPin').value;
      var note = document.getElementById('punchNote').value;
      
      if (code.length < 1) { showStatus('error', 'Please enter your Staff Code.'); return; }
      if (pin.length < 1) { showStatus('error', 'Please enter your PIN.'); return; }

      // ZERO LATENCY LOCAL VALIDATION!
      if (Object.keys(ROSTER).length > 0) {
        var teacher = ROSTER[code];
        if (!teacher) { showStatus('error', '❌ Invalid Staff Code'); return; }
        if (teacher.pin !== pin) { showStatus('error', '❌ Invalid PIN'); return; }
        
        // Validated!
        var tname = teacher.name;
        
        // Capture photo instantly
        var photoData = null;
        if (stream && video.videoWidth > 0) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          var ctx = canvas.getContext('2d');
          ctx.translate(canvas.width, 0);
          ctx.scale(-1, 1);
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          photoData = canvas.toDataURL('image/jpeg', 0.6);
        }

        // INSTANT UI RESPONSE
        showStatus('success', '✅ SUCCESS! ' + tname + ' clocked ' + action);
        document.getElementById('staffCode').value = '';
        document.getElementById('staffPin').value = '';
        document.getElementById('punchNote').value = '';
        setTimeout(function() { document.getElementById('statusMsg').style.display = 'none'; }, 5000);
        
        // BACKGROUND NETWORK CALL (Invisible to user)
        var payload = {
          code: code,
          pin: pin,
          action: action,
          note: note,
          photoData: photoData,
          localTimestamp: new Date().toISOString(),
          deviceId: getDeviceId(),
          userAgent: navigator.userAgent
        };
        fetch(API_URL, {
          redirect: 'follow',
          method: 'POST',
          body: JSON.stringify(payload),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        }).catch(e => console.error("Background sync failed"));
        
      } else {
        // Fallback if roster hasn't loaded yet (only happens in first 0.5s of boot)
        showStatus('error', 'Still syncing data... try again in 1 second.');
      }
    }

    function showStatus(type, msg) {
      var el = document.getElementById('statusMsg');
      el.className = type === 'success' ? 'status-success' : 'status-error';
      el.innerHTML = msg;
      el.style.display = 'block';
    }
  </script>
</body>
</html>
